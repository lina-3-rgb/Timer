<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <script src="./Time.js" defer></script>
    <link rel="stylesheet" href="./slail.css">
</head>

<body class="clic">

    <input class="clic-txt" type="text">

    
    
    <button class="clic-increase">
        <svg width="20" height="10" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,4 36,36 4,36" fill="#000000" />
        </svg>
    </button>
    
    <button class="clic-decrease">
        <svg width="20" height="10" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <polygon points="4,4 36,4 20,36" fill="#000000"/>
</svg>
    </button>


    <button class="clic-stop">
        <svg width="20px" height="20px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 1V15L14 8L3 1Z" fill="#000000" />
        </svg>
    </button>
    <button class="clic-reboot">
        <svg width="20px" height="20px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M8 3V1L4 4L8 7V5C10.76 5 13 7.24 13 10C13 12.76 10.76 15 8 15C5.24 15 3 12.76 3 10H1C1 13.87 4.13 17 8 17C11.87 17 15 13.87 15 10C15 6.13 11.87 3 8 3Z"
                fill="#000000" />
        </svg>
    </button>
    <button class="clic-paus">
        <svg width="20px" height="20px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 1H2V15H7V1Z" fill="#000000" />
            <path d="M14 1H9V15H14V1Z" fill="#000000" />
        </svg>
    </button>
</body>

</html>
